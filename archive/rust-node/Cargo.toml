[package]
name = "brim-veracity"
version = "0.1.0"
edition = "2021"
description = "Brim network implementation with Veracity Protocol"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] } 