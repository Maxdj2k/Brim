<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Brim Research</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #020617; color: #e5e7eb; }
    .card { width: min(520px, calc(100% - 32px)); background: #111827; border: 1px solid #334155; border-radius: 18px; padding: 28px; }
    label { display: grid; gap: 8px; margin-top: 16px; font-weight: 700; }
    input { border: 1px solid #475569; border-radius: 12px; padding: 12px 14px; background: #020617; color: #f8fafc; font-size: 16px; }
    button { border: 0; border-radius: 12px; padding: 13px 18px; background: #38bdf8; color: #082f49; font-weight: 800; cursor: pointer; margin-top: 18px; }
    p, li { color: #94a3b8; }
    .errors { color: #fca5a5; }
  </style>
</head>
<body>
  <section class="card">
    <h1>Create a Brim Research Login</h1>
    <p>After signup, you can test the Veracity Protocol through the research search engine.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Create Account</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Log in</a>.</p>
  </section>
</body>
</html>
