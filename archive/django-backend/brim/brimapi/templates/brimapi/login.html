<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brim Login</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #020617; color: #e5e7eb; }
    .card { width: min(420px, calc(100% - 32px)); background: #111827; border: 1px solid #334155; border-radius: 18px; padding: 28px; }
    label { display: grid; gap: 8px; margin-top: 16px; font-weight: 700; }
    input { border: 1px solid #475569; border-radius: 12px; padding: 12px 14px; background: #020617; color: #f8fafc; font-size: 16px; }
    button, a.button { display: inline-block; border: 0; border-radius: 12px; padding: 13px 18px; background: #38bdf8; color: #082f49; font-weight: 800; cursor: pointer; text-decoration: none; margin-top: 18px; }
    p { color: #94a3b8; }
    .error { color: #fca5a5; }
  </style>
</head>
<body>
  <section class="card">
    <h1>Log in to Brim Research</h1>
    <p>Access the public research search engine.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Log In</button>
    </form>
    <p>Need an account? <a href="{% url 'signup' %}">Create one</a>.</p>
  </section>
</body>
</html>
