<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brim Admin</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: #e5e7eb; }
    main { max-width: 900px; margin: 0 auto; padding: 48px 20px; }
    .card { background: #111827; border: 1px solid #334155; border-radius: 18px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    h1 { margin: 0 0 8px; font-size: 32px; }
    p { color: #94a3b8; }
    form { display: grid; gap: 16px; margin-top: 24px; }
    label { display: grid; gap: 8px; font-weight: 700; }
    input { border: 1px solid #475569; border-radius: 12px; padding: 12px 14px; background: #020617; color: #f8fafc; font-size: 16px; }
    button { border: 0; border-radius: 12px; padding: 13px 18px; background: #38bdf8; color: #082f49; font-weight: 800; cursor: pointer; }
    pre { overflow: auto; background: #020617; border: 1px solid #334155; border-radius: 12px; padding: 16px; min-height: 120px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Brim Administrative Console</h1>
      <p>Create users through the same Django API that the CLI can call.</p>

      <form id="create-user-form">
        <div class="grid">
          <label>
            Username
            <input id="username" name="username" autocomplete="username" required>
          </label>
          <label>
            Password
            <input id="password" name="password" type="password" autocomplete="new-password" required>
          </label>
        </div>
        <button type="submit">Create User</button>
      </form>

      <h2>API Response</h2>
      <pre id="result">Waiting for action...</pre>
    </section>
  </main>

  <script>
    const form = document.getElementById('create-user-form');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      result.textContent = 'Creating user...';

      const payload = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      };

      try {
        const response = await fetch('/api/users/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = error.toString();
      }
    });
  </script>
</body>
</html>
