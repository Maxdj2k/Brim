<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brim Search</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; }
    header { border-bottom: 1px solid #e2e8f0; padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; background: white; position: sticky; top: 0; }
    main { max-width: 1280px; margin: 0 auto; padding: 28px 20px; }
    a { color: #2563eb; text-decoration: none; }
    a.secondary { border-radius: 999px; padding: 10px 14px; background: #e2e8f0; color: #0f172a; font-weight: 700; }
    .brand { font-size: 22px; font-weight: 900; color: #0f766e; }
    .search-box { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; max-width: 760px; margin-bottom: 24px; }
    input { border: 1px solid #cbd5e1; border-radius: 999px; padding: 15px 20px; background: white; color: #0f172a; font-size: 17px; box-shadow: 0 8px 25px rgba(15, 23, 42, .08); }
    button { border: 0; border-radius: 999px; padding: 14px 22px; background: #0f766e; color: white; font-weight: 800; cursor: pointer; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 26px; align-items: start; }
    .result { padding: 20px 0; border-bottom: 1px solid #e2e8f0; cursor: pointer; }
    .result:hover .result-title h2 { text-decoration: underline; }
    .result-title { display: block; text-decoration: none; }
    .result-title h2 { margin: 6px 0; color: #1d4ed8; font-size: 22px; }
    .url { color: #15803d; font-size: 14px; }
    .summary { color: #475569; line-height: 1.5; }
    .badge { display: inline-block; border-radius: 999px; padding: 4px 9px; background: #dcfce7; color: #166534; font-size: 12px; font-weight: 800; }
    .panel { background: white; border: 1px solid #e2e8f0; border-radius: 22px; padding: 22px; box-shadow: 0 18px 50px rgba(15, 23, 42, .12); position: sticky; top: 84px; }
    .panel h2 { margin-top: 0; }
    .score { display: grid; gap: 10px; margin: 16px 0; }
    .metric { display: grid; gap: 6px; }
    .metric-row { display: flex; justify-content: space-between; font-size: 14px; color: #475569; }
    .bar { height: 9px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
    .bar span { display: block; height: 100%; background: #0f766e; }
    .source { border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; margin-top: 8px; background: #f8fafc; color: #334155; }
    pre { white-space: pre-wrap; background: #0f172a; color: #d1fae5; border-radius: 14px; padding: 14px; overflow: auto; font-size: 12px; }
    .scan-btn { width: 100%; margin-top: 12px; background: #1d4ed8; }
    .big-score { font-size: 40px; font-weight: 900; color: #0f766e; }
    .feed { margin-top: 18px; border-top: 1px solid #e2e8f0; padding-top: 14px; }
    .review { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-top: 10px; background: #f8fafc; }
    .review .who { font-weight: 800; color: #0f172a; }
    .stars { color: #d97706; font-weight: 800; }
    .review-form { display: grid; gap: 8px; margin-top: 12px; }
    .review-form select, .review-form textarea { border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px; font-size: 14px; font-family: inherit; }
    .muted { color: #64748b; font-size: 13px; }
    @media (max-width: 980px) { .layout, .search-box { grid-template-columns: 1fr; } .panel { position: static; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">Brim Search</div>
    <a class="secondary" href="{% url 'logout' %}">Log Out</a>
  </header>

  <main>
    <form id="search-form" class="search-box">
      <input id="query" value="environmental science" placeholder="Search any research topic" required>
      <button type="submit">Search</button>
    </form>

    <div class="layout">
      <section>
        <div id="results"><p>Search any research topic. Each result is scanned by the Brim Veracity Protocol in real time.</p></div>
      </section>

      <aside class="panel">
        <h2>Live Veracity Panel</h2>
        <p id="panel-intro">Select a result to scan authority, source transparency, and supporting sources in real time.</p>
        <div id="veracity-panel">
          <pre>No website selected.</pre>
        </div>
      </aside>
    </div>
  </main>

  <script>
    const form = document.getElementById('search-form');
    const results = document.getElementById('results');
    const panel = document.getElementById('veracity-panel');
    let currentResults = [];

    let selectedItem = null;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function stars(score) {
      const rounded = Math.round(score);
      return '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
    }

    function renderPanel(item) {
      selectedItem = item;
      const protocol = item.veracity_protocol;
      panel.innerHTML = `
        <span class="badge">${protocol.validated ? 'Verified by Brim' : 'Needs Review'}</span>
        <h3>${escapeHtml(item.title)}</h3>
        <p class="url">${escapeHtml(item.display_url)}</p>
        <div id="scan-output"><p class="muted">AI agent scanning the site...</p></div>
        <div class="feed" id="community-feed"></div>
      `;
      runScan(item);
      loadCommunity(item.url);
    }

    async function runScan(item) {
      const output = document.getElementById('scan-output');
      output.innerHTML = '<p class="muted">AI agent fetching and scanning the site...</p>';
      try {
        const response = await fetch('/api/scan/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: item.url }),
        });
        const data = await response.json();
        if (data.error) {
          output.innerHTML = `<p class="muted">${escapeHtml(data.error)}</p>`;
          return;
        }
        const breakdown = (data.signals && data.signals.score_breakdown) || {};
        output.innerHTML = `
          <div class="big-score">${data.score}<span class="muted" style="font-size:16px;">/100</span></div>
          <p class="muted">${data.reachable ? 'Site reached and analyzed' : 'Site not reachable - domain-only score'}${data.cached ? ' (cached)' : ''}</p>
          ${Object.keys(breakdown).length ? `<h4>Agent score breakdown</h4>${
            Object.entries(breakdown).map(([key, value]) => `
              <div class="metric-row"><span>${escapeHtml(key)}</span><strong>${value}</strong></div>
            `).join('')
          }` : ''}
          <h4>Signals</h4>
          <pre>${escapeHtml(JSON.stringify(data.signals, null, 2))}</pre>
        `;
      } catch (error) {
        output.innerHTML = `<p class="muted">${escapeHtml(error.toString())}</p>`;
      }
    }

    function renderCommunity(data) {
      const feed = document.getElementById('community-feed');
      if (!feed) return;
      const avg = data.average_accreditation;
      feed.innerHTML = `
        <h4>Community Accreditation</h4>
        <p>${avg !== null ? `<span class="stars">${stars(avg)}</span> ${avg} / 5 from ${data.review_count} member${data.review_count === 1 ? '' : 's'}` : 'No community reviews yet. Be the first.'}</p>
        <div id="reviews">${data.reviews.map((review) => `
          <div class="review">
            <div class="who">${escapeHtml(review.user)} <span class="stars">${stars(review.accreditation)}</span></div>
            ${review.comment ? `<div>${escapeHtml(review.comment)}</div>` : ''}
          </div>
        `).join('')}</div>
        <form class="review-form" id="review-form">
          <label>Your accreditation rating
            <select id="accreditation">
              <option value="5">5 - Highly accredited</option>
              <option value="4">4 - Trustworthy</option>
              <option value="3" selected>3 - Mixed</option>
              <option value="2">2 - Questionable</option>
              <option value="1">1 - Not credible</option>
            </select>
          </label>
          <textarea id="comment" rows="2" placeholder="Why? (optional)"></textarea>
          <button type="submit">Submit Review</button>
        </form>
      `;
      document.getElementById('review-form').addEventListener('submit', submitReview);
    }

    async function loadCommunity(url) {
      try {
        const response = await fetch(`/api/reviews/?url=${encodeURIComponent(url)}`);
        renderCommunity(await response.json());
      } catch (error) {
        const feed = document.getElementById('community-feed');
        if (feed) feed.innerHTML = `<p class="muted">${escapeHtml(error.toString())}</p>`;
      }
    }

    async function submitReview(event) {
      event.preventDefault();
      if (!selectedItem) return;
      const accreditation = document.getElementById('accreditation').value;
      const comment = document.getElementById('comment').value;
      try {
        const response = await fetch('/api/reviews/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: selectedItem.url, accreditation, comment }),
        });
        renderCommunity(await response.json());
      } catch (error) {
        const feed = document.getElementById('community-feed');
        if (feed) feed.innerHTML = `<p class="muted">${escapeHtml(error.toString())}</p>`;
      }
    }

    function renderResults(data) {
      currentResults = data.results;
      if (!currentResults.length) {
        results.innerHTML = '<p>No websites found.</p>';
        panel.innerHTML = '<pre>No protocol output.</pre>';
        return;
      }

      results.innerHTML = `
        <p>${currentResults.length} results for <strong>${data.query}</strong></p>
        ${currentResults.map((item, index) => `
          <article class="result" data-index="${index}">
            <a href="${item.url}" target="_blank" class="result-title" rel="noopener noreferrer">
              <div class="url">${item.display_url}</div>
              <h2>${item.title}</h2>
            </a>
            <p class="summary">${item.summary}</p>
            <span class="badge">${item.source_type}</span>
          </article>
        `).join('')}
      `;

      document.querySelectorAll('.result').forEach((element) => {
        element.addEventListener('click', () => renderPanel(currentResults[element.dataset.index]));
      });

      renderPanel(currentResults[0]);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const query = document.getElementById('query').value;
      results.innerHTML = '<p>Searching websites...</p>';
      panel.innerHTML = '<pre>Scanning search results...</pre>';

      try {
        const response = await fetch(`/api/search/?query=${encodeURIComponent(query)}&max_results=10`);
        if (response.redirected) {
          window.location.href = '{% url "login" %}';
          return;
        }
        renderResults(await response.json());
      } catch (error) {
        results.textContent = error.toString();
        panel.textContent = error.toString();
      }
    });
  </script>
</body>
</html>
